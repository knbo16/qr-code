<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Đỗ Khôi Nguyên · Thử thách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ===== MÀU SẮC: muốn đổi màu thì sửa 4 dòng này ===== */
:root{
  --bg:#000000;        /* nền */
  --text:#f2efe9;      /* chữ chính */
  --muted:#8c8c8c;     /* chữ phụ */
  --accent:#c9b27c;    /* màu vàng nhạt cho viền và nút */
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;
  display:flex;justify-content:center;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.glow{
  position:fixed;left:50%;top:48%;width:min(120vw,46rem);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(201,178,124,.16),rgba(201,178,124,0) 62%);
  animation:breathe 8s ease-in-out infinite;pointer-events:none;
}
@keyframes breathe{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}

.page{position:relative;width:100%;max-width:25rem;padding:3rem 1.5rem 2.5rem;display:flex;flex-direction:column;align-items:center;transition:opacity .6s ease}
.page.out{opacity:0}
.page.in{animation:pagein .8s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{
  margin:0;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;
  font-size:clamp(2.5rem,12vw,3.4rem);line-height:1.08;letter-spacing:.01em;text-align:center;
}
.rule{width:2.5rem;height:1px;background:var(--accent);margin:1rem 0 .9rem;opacity:.8}
.sub{margin:0 0 1.8rem;color:var(--muted);font-size:.95rem;text-align:center;line-height:1.55;max-width:21rem}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* viền mỏng có vệt sáng chạy chậm, dùng cho bàn xếp hình và thẻ QR */
.frame{
  --a:0deg;padding:1px;border-radius:20px;
  background:conic-gradient(from var(--a),#2b2b2b 0 70%,var(--accent) 88%,#2b2b2b 100%);
  animation:spin 9s linear infinite;
}
@keyframes spin{to{--a:360deg}}
.frame.won{animation:none;background:var(--accent);box-shadow:0 0 36px rgba(201,178,124,.45);transition:box-shadow .5s}

/* ---------- Màn xếp hình ---------- */
.board{
  position:relative;width:min(80vw,20rem);aspect-ratio:1;border-radius:19px;background:#0b0b0b;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.tile{
  position:absolute;padding:0;margin:0;border:1px solid #000;border-radius:0;cursor:pointer;background-color:#111;
  transition:left .16s ease,top .16s ease,opacity .5s ease;
}
.tile.gap{opacity:0;pointer-events:none}
.tile.gap.show{opacity:1}
.peek{position:absolute;inset:0;background-size:cover;opacity:0;transition:opacity .25s;pointer-events:none}
.peek.on{opacity:1}
.thumb{position:relative;padding:0;grid-row:1/3;width:5.8rem;height:5.8rem;border-radius:4px;border:1px solid var(--accent);background-color:#111;background-size:cover;background-position:center;cursor:pointer;box-shadow:0 0 0 3px #000,0 0 0 4px #3a3a3a}
.thumb::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.6) 1px,transparent 1px);background-size:calc(100% / var(--n,3)) calc(100% / var(--n,3))}
.stats{margin-top:1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;width:min(80vw,20rem);color:var(--muted);font-size:.9rem}
.stats .row{display:flex;gap:.6rem;justify-content:flex-end}
.stats{display:grid;grid-template-columns:auto 1fr;column-gap:.9rem;row-gap:.5rem;align-items:center}
.stats #moves{text-align:right}
.msg{min-height:1.5rem;margin:1rem 0 0;color:var(--accent);font-size:.95rem;text-align:center}

.btn{
  font:inherit;font-weight:400;font-size:.9rem;text-decoration:none;cursor:pointer;
  padding:.6rem 1.3rem;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:transparent;
  transition:background .25s,color .25s;
}
.btn:hover{background:var(--accent);color:#000}
.btn.quiet{border-color:#3a3a3a;color:var(--muted)}
.btn.quiet:hover{background:#1a1a1a;color:var(--text)}
.btn.big{padding:.7rem 1.5rem;font-size:.92rem}

/* ---------- Màn thông tin ---------- */
.tabs{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;width:100%}
.tabs button{
  font:inherit;font-size:.92rem;font-weight:400;color:var(--muted);background:none;border:0;cursor:pointer;
  padding:.35rem 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.stage{margin-top:2rem}
.card{
  border-radius:19px;background:#fff;padding:1.1rem 1.1rem .95rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;
  width:min(74vw,18.5rem);
}
.card.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#qr{width:100%;aspect-ratio:1;display:grid;place-items:center;color:#222;font-size:.85rem;text-align:center}
#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
.card .label{margin:0;color:#111;font-weight:600;font-size:.98rem;text-align:center}
.card .hint{margin:-.2rem 0 0;color:#666;font-size:.8rem;text-align:center;line-height:1.4}
.actions{margin-top:1.6rem;display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.foot{margin-top:2.2rem;color:#5e5e5e;font-size:.78rem;text-align:center}

.qcard{width:min(84vw,21rem);padding:1.3rem 1.2rem;border:1px solid #2b2b2b;border-radius:16px;background:#0b0b0b}
.qcard.fade{animation:fade .45s ease both}
.qcount{margin:0 0 .5rem;color:var(--muted);font-size:.8rem}
.qtext{margin:0 0 1rem;font-size:1.1rem;line-height:1.45;color:var(--text);font-weight:400}
.qin{width:100%;font:inherit;font-size:1rem;color:var(--text);background:transparent;border:0;border-bottom:1px solid #3a3a3a;padding:.55rem 0;outline:none;border-radius:0}
.qin:focus{border-bottom-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{font:inherit;font-size:.95rem;text-align:left;color:var(--text);background:transparent;border:1px solid #333;border-radius:12px;padding:.75rem 1rem;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:#666}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(201,178,124,.1)}
.qerr{min-height:1.2rem;margin:.8rem 0 0;color:#d98b8b;font-size:.85rem}
#quiz .actions{margin-top:1.4rem}

@media (prefers-reduced-motion:reduce){
  .glow,.frame,.card.fade,.page.in{animation:none}.glow{opacity:.8}
  .tile{transition:none}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<!-- ============ MÀN 1: XẾP HÌNH ============ -->
<main class="page" id="gate">
  <h1 id="gTitle"></h1>
  <div class="rule"></div>
  <p class="sub" id="gHint"></p>
  <div class="frame" id="boardFrame">
    <div class="board" id="board" role="group" aria-label="Bàn xếp hình"></div>
  </div>
  <div class="stats">
    <button type="button" class="thumb" id="peekBtn"></button>
    <span id="moves" aria-live="off"></span>
    <span class="row">
      <button type="button" class="btn quiet" id="shuffleBtn"></button>
    </span>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
</main>

<!-- ============ MÀN 1.5: CÂU HỎI ============ -->
<main class="page" id="quiz" hidden>
  <h1 id="qTitle"></h1>
  <div class="rule"></div>
  <p class="sub" id="qIntro"></p>
  <div class="qcard">
    <p class="qcount" id="qCount"></p>
    <p class="qtext" id="qText"></p>
    <div id="qBody"></div>
    <p class="qerr" id="qErr" role="alert"></p>
  </div>
  <div class="actions" id="qActions"></div>
</main>

<!-- ============ MÀN 2: THÔNG TIN ============ -->
<main class="page" id="info" hidden>
  <h1 id="name"></h1>
  <div class="rule"></div>
  <p class="sub" id="subtitle"></p>
  <div class="tabs" role="tablist" id="tabs" aria-label="Chọn mã QR"></div>
  <div class="stage">
    <div class="frame">
      <div class="card" id="card" role="tabpanel">
        <div id="qr"></div>
        <p class="label" id="label"></p>
        <p class="hint" id="hint"></p>
      </div>
    </div>
  </div>
  <div class="actions" id="actions"></div>
  <p class="foot" id="foot"></p>
</main>

(function(){
  var P = CONFIG.puzzle, N = Math.max(2, Math.min(5, P.size|0 || 3)), TOTAL = N*N, EMPTY = TOTAL - 1;
  var gate = document.getElementById("gate"), board = document.getElementById("board"),
      frame = document.getElementById("boardFrame"), movesEl = document.getElementById("moves"),
      msg = document.getElementById("msg"), peekBtn = document.getElementById("peekBtn"),
      shuffleBtn = document.getElementById("shuffleBtn");
  var accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#c9b27c";
  var text = getComputedStyle(document.documentElement).getPropertyValue("--text").trim() || "#f2efe9";

  document.getElementById("gTitle").textContent = P.title;
  document.getElementById("gHint").textContent = P.hint;
  peekBtn.setAttribute("aria-label", P.peekText); peekBtn.title = P.peekText; shuffleBtn.textContent = P.shuffleText;
  document.title = CONFIG.name + " · Thử thách";

  var pos = [], moves = 0, locked = true, tiles = [], peek;

  function art(){
    var S = 720, c = document.createElement("canvas"); c.width = c.height = S;
    var x = c.getContext("2d");
    x.fillStyle = "#060606"; x.fillRect(0,0,S,S);
    var g = x.createRadialGradient(S*.5,S*.45,40,S*.5,S*.5,S*.75);
    g.addColorStop(0,"rgba(201,178,124,.22)"); g.addColorStop(1,"rgba(201,178,124,0)");
    x.fillStyle = g; x.fillRect(0,0,S,S);
    /* vài đường chéo mảnh ở góc dưới trái, để mỗi mảnh nhìn khác nhau */
    x.strokeStyle = accent; x.lineWidth = 2; x.globalAlpha = .55;
    for (var i=0;i<5;i++){ x.beginPath(); x.moveTo(30, S-170-i*34); x.lineTo(170+i*34, S-30); x.stroke(); }
    x.globalAlpha = 1;
    /* hai khung viền */
    x.lineWidth = 7; x.strokeRect(26,26,S-52,S-52);
    x.lineWidth = 1.5; x.strokeRect(50,50,S-100,S-100);
    /* chấm sáng ở góc trên phải */
    [[560,120,5],[610,170,3],[520,185,2.5],[600,95,2],[650,130,3.5]].forEach(function(d){
      x.beginPath(); x.arc(d[0],d[1],d[2],0,6.283); x.fillStyle = accent; x.fill();
    });
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = text; x.font = 'italic 500 400px "Cormorant Garamond",Georgia,"Times New Roman",serif';
    x.fillText(P.monogram, S/2, S/2-30);
    x.fillStyle = accent; x.fillRect(S/2-60, S-175, 120, 2);
    x.font = 'italic 500 56px "Cormorant Garamond",Georgia,"Times New Roman",serif';
    x.fillText(P.caption, S/2, S-118);
    return c.toDataURL("image/png");
  }

  function build(url){
    board.innerHTML = "";
    tiles = [];
    for (var t=0;t<TOTAL;t++){
      var b = document.createElement("button");
      b.type = "button"; b.className = "tile" + (t===EMPTY ? " gap" : "");
      b.style.width = b.style.height = (100/N) + "%";
      b.style.backgroundImage = "url(" + url + ")";
      b.style.backgroundSize = (N*100) + "% " + (N*100) + "%";
      var r = Math.floor(t/N), cc = t%N;
      b.style.backgroundPosition = (N>1 ? cc/(N-1)*100 : 0) + "% " + (N>1 ? r/(N-1)*100 : 0) + "%";
      b.setAttribute("aria-label","Mảnh " + (t+1));
      if (t===EMPTY){ b.tabIndex = -1; b.setAttribute("aria-hidden","true"); }
      (function(id){ b.addEventListener("click", function(){ tap(id); }); })(t);
      board.appendChild(b); tiles.push(b);
    }
    peekBtn.style.backgroundImage = "url(" + url + ")"; peekBtn.style.setProperty("--n", N);
    peek = document.createElement("div"); peek.className = "peek";
    peek.style.backgroundImage = "url(" + url + ")"; board.appendChild(peek);
  }

  function place(){
    for (var cell=0; cell<TOTAL; cell++){
      var el = tiles[pos[cell]];
      el.style.left = (cell%N)*100/N + "%"; el.style.top = Math.floor(cell/N)*100/N + "%";
    }
    movesEl.textContent = P.movesText + ": " + moves;
  }
  function solved(){ for (var i=0;i<TOTAL;i++) if (pos[i]!==i) return false; return true; }

  function shuffle(){
    pos = []; for (var i=0;i<TOTAL;i++) pos.push(i);
    var e = EMPTY, prev = -1, steps = TOTAL*30;
    do{
      for (var s=0;s<steps;s++){
        var r = Math.floor(e/N), c = e%N, opts = [];
        if (r>0) opts.push(e-N); if (r<N-1) opts.push(e+N);
        if (c>0) opts.push(e-1); if (c<N-1) opts.push(e+1);
        opts = opts.filter(function(o){ return o!==prev; });
        var n = opts[Math.floor(Math.random()*opts.length)];
        pos[e] = pos[n]; pos[n] = EMPTY; prev = e; e = n;
      }
    } while (solved());
    moves = 0; locked = false; msg.textContent = "";
    frame.classList.remove("won"); tiles[EMPTY].classList.remove("show");
    place();
  }

  function tap(id){
    if (locked) return;
    var cell = pos.indexOf(id), e = pos.indexOf(EMPTY);
    var cr = Math.floor(cell/N), cc = cell%N, er = Math.floor(e/N), ec = e%N;
    if (cr!==er && cc!==ec) return;
    var step = cr===er ? (cc<ec ? 1 : -1) : (cr<er ? N : -N), k = e;
    while (k !== cell){ pos[k] = pos[k-step]; k -= step; }
    pos[cell] = EMPTY;
    moves++; place();
    if (solved()) win();
  }

  function win(){
    locked = true;
    tiles[EMPTY].classList.add("show"); frame.classList.add("won");
    msg.textContent = P.winText;
    setTimeout(function(){
      gate.classList.add("out");
      setTimeout(function(){
        gate.hidden = true; window.startQuiz();
      }, 650);
    }, 1300);
  }

  peekBtn.addEventListener("click", function(){ peek && peek.classList.toggle("on"); });
  shuffleBtn.addEventListener("click", function(){ if (!document.getElementById("gate").hidden) shuffle(); });

  var ready = new Promise(function(res){
    var t = setTimeout(res, 1500);
    try{ document.fonts.load('italic 500 100px "Cormorant Garamond"').then(function(){ clearTimeout(t); res(); }, res); }catch(e){}
  });
  ready.then(function(){
    if (!PUZZLE_IMAGE){ build(art()); shuffle(); return; }
    var img = new Image();
    img.onload = function(){
      var S = 720, c = document.createElement("canvas"); c.width = c.height = S;
      var x = c.getContext("2d"), m = Math.min(img.width, img.height);
      x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      build(c.toDataURL("image/jpeg", .9)); shuffle();
    };
    img.onerror = function(){ build(art()); shuffle(); };
    img.src = PUZZLE_IMAGE;
  });
})();

/* ---------------------------- CÂU HỎI ---------------------------- */
window.startQuiz = (function(){
  var started = false;
  return function(){
    if (started) return; started = true;
    var Q = CONFIG.quiz, qs = Q.questions, idx = 0, ans = [];
    var $ = function(id){ return document.getElementById(id); };
    var card = document.querySelector(".qcard");
    $("quiz").hidden = false; $("quiz").classList.add("in"); window.scrollTo(0,0);
    $("qTitle").textContent = Q.title; $("qIntro").textContent = Q.intro;
    document.title = CONFIG.name + " · Câu hỏi";

    /* kết nối cơ sở dữ liệu (chỉ có khi mở trang trên Claude và người xem đã đăng nhập) */
    var dbRef = null, dbState = "wait";
    var ready = (async function(){
      try{
        if (!window.claude || !claude.use) throw 0;
        var d = await claude.use("db"), u = await claude.use("user");
        var id = u ? await u.id() : null;
        if (d && id){ dbRef = d.doc("answers/" + id); dbState = "ok"; } else dbState = "none";
      }catch(e){ dbState = "none"; }
    })();

    function btn(text, cls, fn){
      var b = document.createElement("button"); b.type = "button"; b.className = "btn big" + (cls ? " " + cls : "");
      b.textContent = text; b.onclick = fn; return b;
    }
    function fadeIn(){ card.classList.remove("fade"); void card.offsetWidth; card.classList.add("fade"); }

    function render(){
      var q = qs[idx], body = $("qBody"), acts = $("qActions");
      fadeIn();
      $("qCount").textContent = (idx + 1) + " / " + qs.length;
      $("qText").textContent = q.text; $("qErr").textContent = ""; body.innerHTML = ""; acts.innerHTML = "";
      if (q.type === "choice"){
        var box = document.createElement("div"); box.className = "opts"; box.setAttribute("role","group");
        q.options.forEach(function(o, i){
          var b = document.createElement("button"); b.type = "button"; b.className = "opt";
          b.textContent = (i + 1) + ". " + o; b.setAttribute("aria-pressed", ans[idx] === o);
          b.onclick = function(){
            ans[idx] = o; $("qErr").textContent = "";
            [].forEach.call(box.children, function(c){ c.setAttribute("aria-pressed", c === b); });
          };
          box.appendChild(b);
        });
        body.appendChild(box);
      } else {
        var inp = document.createElement("input"); inp.type = "text"; inp.className = "qin"; inp.maxLength = 200;
        inp.placeholder = q.placeholder || ""; inp.value = ans[idx] || ""; inp.autocomplete = "off";
        inp.setAttribute("aria-label", q.text);
        inp.oninput = function(){ ans[idx] = inp.value; };
        inp.onkeydown = function(e){ if (e.key === "Enter"){ e.preventDefault(); next(); } };
        body.appendChild(inp);
      }
      if (idx > 0) acts.appendChild(btn(Q.backText, "quiet", function(){ idx--; render(); }));
      acts.appendChild(btn(idx === qs.length - 1 ? Q.doneText : Q.nextText, "", next));
    }

    function next(){
      var q = qs[idx], v = String(ans[idx] || "").trim();
      if (!v){ $("qErr").textContent = q.type === "choice" ? Q.pickMsg : Q.emptyMsg; return; }
      ans[idx] = v;
      if (idx < qs.length - 1){ idx++; render(); } else finish();
    }

    function showInfo(){
      $("quiz").hidden = true; var inf = $("info"); inf.hidden = false; inf.classList.add("in");
      window.scrollTo(0,0); document.title = CONFIG.name + " · Mã QR"; window.startInfo();
    }

    async function finish(){
      var rows = qs.map(function(q, i){ return { q: q.text, a: ans[i] }; });
      $("qBody").innerHTML = ""; $("qActions").innerHTML = ""; $("qErr").textContent = "";
      $("qCount").textContent = ""; $("qText").textContent = Q.savingText; fadeIn();
      await Promise.race([ready, new Promise(function(r){ setTimeout(r, 4000); })]);
      if (dbState === "ok"){
        try{ await dbRef.set({ qa: rows, at: new Date().toISOString() }); return showInfo(); }catch(e){}
      }
      /* không lưu được: mời gửi qua tin nhắn */
      var msg = Q.smsIntro + "\n" + rows.map(function(r){ return r.q + " " + r.a; }).join("\n");
      $("qText").textContent = Q.smsAsk; fadeIn();
      var a = document.createElement("a"); a.className = "btn big"; a.textContent = Q.smsText;
      a.href = "sms:" + Q.smsTo + "?&body=" + encodeURIComponent(msg);
      a.addEventListener("click", function(){ setTimeout(showInfo, 700); });
      $("qActions").appendChild(a);
      $("qActions").appendChild(btn(Q.skipText, "quiet", showInfo));
    }

    render();
  };
})();

/* ---------------------------- THÔNG TIN ---------------------------- */
window.startInfo = (function(){
  var started = false;
  return function(){
    if (started) return; started = true;
    var ITEMS = CONFIG.items, cur = null;
    var qrBox = document.getElementById("qr"), card = document.getElementById("card"),
        label = document.getElementById("label"), hint = document.getElementById("hint"),
        actions = document.getElementById("actions"), tabsEl = document.getElementById("tabs");
    document.getElementById("name").textContent = CONFIG.name;
    document.getElementById("subtitle").textContent = CONFIG.subtitle;
    document.getElementById("foot").textContent = CONFIG.footer;

    var tabs = ITEMS.map(function(it){
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role","tab"); b.id = "t-" + it.key; b.dataset.k = it.key;
      b.textContent = it.tab; tabsEl.appendChild(b); return b;
    });
    function find(k){ for (var i=0;i<ITEMS.length;i++) if (ITEMS[i].key===k) return ITEMS[i]; return null; }
    function drawQR(t){
      qrBox.innerHTML = "";
      try{ new QRCode(qrBox,{text:t,width:480,height:480,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
      catch(e){ qrBox.textContent = "Không tạo được mã QR. Hãy dùng nút bên dưới."; }
    }
    function copyText(s, btn){
      var done = function(){ var o = btn.textContent; btn.textContent = "Đã sao chép"; setTimeout(function(){ btn.textContent = o; }, 1600); };
      function fallback(){
        try{
          var ta = document.createElement("textarea"); ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done();
        }catch(e){}
      }
      try{ if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(done, fallback); return; } }catch(e){}
      fallback();
    }
    function show(k, fromUser){
      var it = find(k) || ITEMS[0];
      if (!it || it.key === cur) return;
      cur = it.key;
      tabs.forEach(function(b){
        var on = b.dataset.k === cur;
        b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
        if (on) card.setAttribute("aria-labelledby", b.id);
      });
      drawQR(it.data);
      label.textContent = it.label; hint.textContent = it.hint;
      actions.innerHTML = "";
      (it.buttons || []).forEach(function(a, i){
        var el;
        if (a.href){
          el = document.createElement("a"); el.href = a.href;
          if (a.href.indexOf("http") === 0){ el.target = "_blank"; el.rel = "noopener"; }
        } else {
          el = document.createElement("button"); el.type = "button";
          el.onclick = function(){ copyText(a.copy, el); };
        }
        el.className = "btn big" + (i > 0 ? " quiet" : ""); el.textContent = a.text; actions.appendChild(el);
      });
      card.classList.remove("fade"); void card.offsetWidth; card.classList.add("fade");
      if (fromUser){ try{ history.replaceState(null, "", "#" + cur); }catch(e){} }
    }
    tabs.forEach(function(b, i){
      b.addEventListener("click", function(){ show(b.dataset.k, true); });
      b.addEventListener("keydown", function(e){
        var n = null;
        if (e.key === "ArrowRight") n = (i + 1) % tabs.length;
        if (e.key === "ArrowLeft") n = (i - 1 + tabs.length) % tabs.length;
        if (n !== null){ e.preventDefault(); tabs[n].focus(); show(tabs[n].dataset.k, true); }
      });
    });
    window.addEventListener("hashchange", function(){ show(location.hash.slice(1), false); });
    show(location.hash.slice(1), false);
  };
})();
</script>
